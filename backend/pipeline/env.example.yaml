# Copy to env.yaml for `gcloud functions deploy --env-vars-file env.yaml`. Never commit env.yaml.
GCS_BUCKET: ""
GLOBUS_GCS_COLLECTION: ""      # collection UUID of the bucket (Globus Connect Server, Google Cloud Storage connector)
GLOBUS_OSC_COLLECTION: ""      # OSC's collection UUID (see OSC's Globus docs)
OSC_ROOT: "/fs/ess/<project>/yield-studio/"
GLOBUS_CLIENT_ID: ""           # Globus service app (app.globus.org/settings/developers); give it access to both collections
GLOBUS_CLIENT_SECRET: ""
